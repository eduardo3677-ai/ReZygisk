name: Untrusted CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup signing keys
        env:
          private_key: ${{ secrets.SIGNING_PRIVATE_KEY }}
          public_key: ${{ secrets.SIGNING_PUBLIC_KEY }}
        run: |
          if [ -z "$private_key" ] || [ -z "$public_key" ]; then
            echo "Signing keys not configured, building without signing"
          else
            echo "$private_key" | base64 -d > module/private_key
            echo "$public_key" | base64 -d > module/public_key
          fi

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r29

      - name: Setup NDK_PATH
        run: echo "NDK_PATH=${{ steps.setup_ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Build
        run: |
          make all -j$(nproc)

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: ReZygisk-release
          path: "build/out/ReZygisk-v*-release.zip"

      - name: Upload debug
        uses: actions/upload-artifact@v4
        with:
          name: ReZygisk-debug
          path: "build/out/ReZygisk-v*-debug.zip"
