name: Untrusted CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r29

      - name: Setup NDK_PATH
        run: echo "NDK_PATH=${{ steps.setup_ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Build
        run: |
          make all -j$(nproc)

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: ReZygisk-release
          path: "build/out/ReZygisk-v*-release.zip"

      - name: Upload debug
        uses: actions/upload-artifact@v4
        with:
          name: ReZygisk-debug
          path: "build/out/ReZygisk-v*-debug.zip"
